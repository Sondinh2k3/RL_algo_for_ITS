# MGMQ Model Configuration
# Các tham số mô hình MGMQ cho training và evaluation

# ============================================
# Network Configuration
# ============================================
network:
  # Name of the traffic network (used as folder name under network/)
  name: leductho

  # Base path for network files (relative to project root)
  # If not specified, defaults to: network/{network_name}/
  base_path: null

  # Network files (relative to base_path if base_path is set, or absolute paths)
  net_file: leductho.net.xml

  # Route files - can be a single file or comma-separated list
  # Order matters: type definitions should come before trip definitions
  route_files:
    - leductho.rou.xml # Vehicle type definitions
    - leductho-demo.rou.xml # Demo traffic routes (optional)

  # Detector configuration file (for E2 detector-based rewards)
  detector_file: detector.add.xml

  # Intersection preprocessing config (for phase standardization)
  intersection_config: intersection_config.json

# =========================it, it already has the GESA settings. Let me check — was this already updated? Let me look at what happ===================
# MGMQ Architecture Parameters
# ============================================
mgmq:
  # GAT (Graph Attention Network) parameters
  gat:
    hidden_dim: 32 # GAT hidden dimension
    output_dim: 32 # GAT output dimension per head
    num_heads: 4 # Number of GAT attention heads

  # GraphSAGE parameters
  graphsage:
    hidden_dim: 64 # GraphSAGE hidden dimension

  # Bi-GRU parameters
  gru:
    hidden_dim: 64 # Bi-GRU hidden dimension

  # Policy and Value network parameters
  policy:
    hidden_dims: [128, 64] # Policy network hidden dimensions

  value:
    hidden_dims: [256, 128, 64] # Value network hidden dimensions (wider to handle 1600-dim input)

  # Regularization
  dropout: 0.1 # Reduced from 0.3 - excessive dropout hurts RL training

  # Temporal observation
  history_length: 1 # Observation history length (window size)

  # Local GNN settings
  local_gnn:
    enabled: false # Use LocalMGMQTorchModel
    max_neighbors: 4 # Maximum neighbors (K) for local GNN
    obs_dim: 56 # 4 lane features * 12 detectors + 8 green-time ratios

# ============================================
# PPO Training Parameters (network-agnostic)
# ============================================
# These values are scale-invariant once advantages are normalized per minibatch
# and rewards are normalized + frozen after warmup (see `environment.reward_norm`).
# You should not need to retune them when switching networks.
ppo:
  learning_rate: 3.0e-4
  gamma: 0.99
  lambda_: 0.95
  clip_param: 0.2
  entropy_coeff: 0.02
  kl_target: 0.01
  kl_coeff_floor: 0.1
  # Symmetric value clipping (Δvalue), like the OpenAI PPO baseline.
  # Independent of reward scale: applied to (V - V_old), not to MSE.
  vf_clip_param: 0.2
  vf_loss_coeff: 0.5
  num_sgd_iter: 6
  grad_clip: 1.0

# ============================================
# Batch / Iteration Scaling
# ============================================
# Batch size, minibatch size and num_iterations are derived from these
# scale-free knobs; they auto-adjust to N_agents and episode length.
#
#   episodes_per_iter = target_episodes_per_iter (if N_agents <= 3) else 2
#   train_batch_size = N_agents · T_episode · episodes_per_iter
#   minibatch_size   = train_batch_size // minibatch_per_iter
#   num_iterations   = ceil(target_agent_steps / train_batch_size)
#
# Set `target_episodes_per_iter` higher for less-noisy gradient estimates
# on very small networks; larger networks use a fixed value of 2.
# and `target_agent_steps` to control the total environment-interaction budget.
scaling:
  target_episodes_per_iter: 8
  # target_episodes_per_iter: 24  # Dùng cho mạng có 1 hoặc 2 nút
  minibatch_per_iter: 4
  target_agent_steps: 5000000

# ============================================
# Training Settings
# ============================================
# Leave `num_iterations: auto` to derive from `scaling.target_agent_steps`,
# or override with a fixed integer. Same for `num_workers: auto` (uses
# os.cpu_count() - 2, capped at 8).
training:
  num_iterations: auto
  num_workers: auto
  num_envs_per_worker: 1
  checkpoint_interval: 5
  patience: 500
  seed: 42
  use_gpu: false
  output_dir: "./results_mgmq"

# ============================================
# Reward Configuration
# ============================================
reward:
  # Available reward functions:
  # - diff-waiting-time: Difference in waiting time
  # - queue: Queue length based reward
  # - average-speed: Average speed based reward
  # - pressure: Traffic pressure reward
  # - halt-veh-by-detectors: Halted vehicles by detector
  # - diff-departed-veh: Difference in departed vehicles
  # - teleport-penalty: Penalty for teleported vehicles (severe congestion indicator)
  functions:
    - queue
    - throughput
    # - diff-waiting-time
    # - halt-veh-by-detectors
    # - average-speed
    # - teleport-penalty   # Uncomment to penalize teleportation (requires time_to_teleport > 0)
  weights: [0.7, 0.3]  # queue:throughput ratio

# ============================================
# Environment Configuration
# ============================================
environment:
  num_seconds: 3600
  max_green: 90
  min_green: 15
  cycle_time: 150
  yellow_time: 3
  time_to_teleport: 500
  use_phase_standardizer: true
  action_mode: discrete_adjustment  # "ratio", "cycle_level_continuous", or "discrete_adjustment"
  green_time_step: 5

  # Reward normalization — SB3-style scale-only return-based RMS.
  # The env divides each reward by sqrt(var(R)) where R is a per-agent
  # discounted-return accumulator using `ppo.gamma`. This is the standard
  # network-agnostic normalization: no warmup, no freeze, no mean shift.
  # `clip` bounds normalized rewards (in std units).
  reward_norm:
    enabled: true
    clip: 10.0
  # ------------------------------------------------------------------
  # Action modes reference
  # ------------------------------------------------------------------
  # ratio
  #   Continuous simplex via Gaussian + softmax (MaskedSoftmax). The agent
  #   outputs mean+log_std per phase; softmax projects to the simplex.
  #   Phase masking zeros out invalid phases before softmax.
  #
  # cycle_level_continuous
  #   Continuous simplex via Dirichlet (MaskedDirichlet). The agent outputs
  #   concentration parameters (one per standard phase). Samples live on the
  #   8-simplex by construction, so no softmax is required. Typically gives
  #   a lower-variance policy gradient than `ratio`. Invalid phases get a
  #   tiny concentration so their sampled mass is ~0.
  #
  # discrete_adjustment
  #   7 actions per phase: {-15, -10, -5, 0, +5, +10, +15} seconds.
  #   Uses MaskedMultiCategorical. Invalid phases are forced to "keep".
  # ------------------------------------------------------------------
  # The `ratio` and `cycle_level_continuous` modes share the same env-side
  # translator (_get_green_time_from_ratio), so you can switch between them
  # without retraining the environment — only the policy head / distribution
  # changes.
